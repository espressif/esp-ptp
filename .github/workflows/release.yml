name: Release and Upload Components

on:
  # For pull requests: perform upload with "--dry-run" argument,
  # i.e. validate that the component passes all checks for being uploaded.
  pull_request:

  # For pushes to main: run release-please first, then upload components to the registry.
  push:
    branches:
      - main

env:
  UPLOAD_COMPONENTS: |
    esp_ptp

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only run on push to main, not on pull requests
    if: github.event_name == 'push' && github.ref_name == 'main'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    permissions:
      pull-requests: write
      contents: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload_components_dry_run:
    runs-on: ubuntu-latest
    # Only run on pull requests for dry run
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write # Required to generate a GitHub OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: |
          echo "Checking components (dry run)"
      - name: Upload components to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: ${{ env.UPLOAD_COMPONENTS }}
          namespace: "espressif"
          dry_run: true

  upload_components_release:
    runs-on: ubuntu-latest
    # Only run on push to main when release-please actually creates a release
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.release-please.outputs.releases_created == 'true'
    needs: [release-please]
    permissions:
      id-token: write # Required to generate a GitHub OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - run: |
          echo "Uploading components after successful release"
          echo "Released paths: ${{ needs.release-please.outputs.paths_released }}"
      - name: Upload components to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: ${{ join(fromJSON(needs.release-please.outputs.paths_released), '\n') }}
          namespace: "espressif"
          dry_run: ${{ github.repository_owner != 'espressif' }}

  update_mirror_tags:
    runs-on: ubuntu-latest
    # Only run on push to main when release-please actually creates a release
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.release-please.outputs.releases_created == 'true'
    needs: [release-please]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'
      - name: Sync tags to Gitlab
        run: |
          echo "Syncing tags to Gitlab"

          # Configure git for GitLab
          git config --global user.name "${{ secrets.GIT_CONFIG_NAME }}"
          git config --global user.email "${{ secrets.GIT_CONFIG_EMAIL }}"

          # Remove https:// from GITLAB_URL
          GITLAB_URL=$(echo "${{ secrets.GITLAB_URL }}" | sed 's|https://||')

          # Add GitLab remote
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@${GITLAB_URL}/${{ github.repository_owner }}/esp-ptp.git

          # Fetch all tags from current repository
          git fetch --tags

          # Push all tags to GitLab
          git push gitlab --tags

          echo "Tags successfully synced to GitLab"
