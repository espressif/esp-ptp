[pytest]

# only the files with prefix `pytest_` would be recognized as pytest test scripts.
python_files = pytest_*.py

log_cli = true
log_level = INFO

addopts =
    -s -vv
    --tb short
    --embedded-services esp,idf
    --ignore-no-tests-collected-error
    --ignore-glob */managed_components/*

filterwarnings =
    ignore::FutureWarning

junit_family = xunit1

env_markers =
    generic: applicable to generic ESP devices
    eth_ip101: run on IP101 board
    eth_yt8531: run on YT8531 PHY board
    rev_default: Runner with default chip revision connected
    esp32p4_rev1: Runner with ESP32-P4 chip revision 1 connected
